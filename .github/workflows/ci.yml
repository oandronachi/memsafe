name: memsafe-infra-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang python3

      # The self-adjusting runner picks the 'local' backend here and runs the
      # default lanes (debug, release, asan-ubsan, cxx17) via CMake + CTest.
      # It writes testing/build/summary.json (versioned) and per-lane JUnit XML.
      - name: Build & validate
        run: python3 tools/run_tests.py --backend local

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memsafe-infra-results
          path: |
            testing/build/summary.json
            testing/build/**/junit.xml
          if-no-files-found: ignore
